services:
  postgres:
    image: postgres:16
    container_name: dvs-postgres
    mem_limit: 512m
    cpus: 0.5
    environment:
      POSTGRES_USER: dvs
      POSTGRES_PASSWORD: dvs
      POSTGRES_DB: dvs
    ports:
      - "5432:5432"
    volumes:
      - dvs_pg:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dvs -d dvs"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: dvs-mongo
    mem_limit: 512m
    cpus: 0.5
    environment:
      MONGO_INITDB_ROOT_USERNAME: dvs_user
      MONGO_INITDB_ROOT_PASSWORD: dvs_pass_123
    ports:
      - "27017:27017"
    volumes:
      - dvs_mongo:/data/db

  redis:
    image: redis:7
    container_name: dvs-redis
    mem_limit: 256m
    cpus: 0.25
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: dvs-zk
    mem_limit: 256m
    cpus: 0.25
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: dvs-kafka
    mem_limit: 768m
    cpus: 0.75
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: dvs-zk:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://dvs-kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  rabbitmq:
    image: rabbitmq:3-management
    container_name: dvs-rabbit
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  dvs_pg:
  dvs_mongo:
