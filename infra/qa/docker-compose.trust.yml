services:
  audit-log-service:
    image: ghcr.io/gabotoro/audit-log-service:${IMAGE_TAG:-qa}
    env_file:
      - ./env/common.env
      - ./env/trust.env
    environment:
      PORT: "3007"
    ports:
      - "3007:3007"
    restart: unless-stopped

  dashboard-service:
    image: ghcr.io/gabotoro/dashboard-service:${IMAGE_TAG:-qa}
    env_file:
      - ./env/common.env
      - ./env/trust.env
    environment:
      PORT: "3008"
    ports:
      - "3008:3008"
    restart: unless-stopped
