name: Publish Docker Hub (QA)

on:
  push:
    branches: [qa]

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api-gateway:
              - 'api-gateway/**'
              - 'libs/**'
              - 'packages/**'
              - 'contracts/**'
              - 'infra/local/docker/Dockerfile.nx-service'
            auth-service:
              - 'auth-service/**'
              - 'libs/**'
              - 'packages/**'
              - 'contracts/**'
              - 'infra/local/docker/Dockerfile.nx-service'
            user-service:
              - 'user-service/**'
              - 'libs/**'
              - 'packages/**'
              - 'contracts/**'
              - 'infra/local/docker/Dockerfile.nx-service'
            rate-limiter-service:
              - 'rate-limiter-service/**'
              - 'libs/**'
              - 'packages/**'
              - 'contracts/**'
              - 'infra/local/docker/Dockerfile.nx-service'
            election-service:
              - 'election-service/**'
              - 'libs/**'
              - 'packages/**'
              - 'contracts/**'
              - 'infra/local/docker/Dockerfile.nx-service'
            voting-service:
              - 'voting-service/**'
              - 'libs/**'
              - 'packages/**'
              - 'contracts/**'
              - 'infra/local/docker/Dockerfile.nx-service'
            results-service:
              - 'results-service/**'
              - 'libs/**'
              - 'packages/**'
              - 'contracts/**'
              - 'infra/local/docker/Dockerfile.nx-service'
            blockchain-service:
              - 'blockchain-service/**'
              - 'libs/**'
              - 'packages/**'
              - 'contracts/**'
              - 'infra/local/docker/Dockerfile.nx-service'
            reporting-service:
              - 'reporting-service/**'
              - 'libs/**'
              - 'packages/**'
              - 'contracts/**'
              - 'infra/local/docker/Dockerfile.nx-service'
            audit-log-service:
              - 'audit-log-service/**'
              - 'libs/**'
              - 'packages/**'
              - 'contracts/**'
              - 'infra/local/docker/Dockerfile.nx-service'
            dashboard-service:
              - 'dashboard-service/**'
              - 'libs/**'
              - 'packages/**'
              - 'contracts/**'
              - 'infra/local/docker/Dockerfile.nx-service'
            email-notifier-service:
              - 'email-notifier-service/**'
              - 'libs/**'
              - 'packages/**'
              - 'contracts/**'
              - 'infra/local/docker/Dockerfile.nx-service'
            scheduler-backup-service:
              - 'scheduler-backup-service/**'
              - 'libs/**'
              - 'packages/**'
              - 'contracts/**'
              - 'infra/local/docker/Dockerfile.nx-service'
            frontend:
              - 'apps/dvs-app/**'
              - 'infra/local/nginx/**'
              - 'infra/local/docker/Dockerfile.frontend'
      - name: Set matrix
        id: set-matrix
        run: |
          $services = @()
          if ("${{ steps.filter.outputs.api-gateway }}" -eq "true") { $services += "api-gateway" }
          if ("${{ steps.filter.outputs.auth-service }}" -eq "true") { $services += "auth-service" }
          if ("${{ steps.filter.outputs.user-service }}" -eq "true") { $services += "user-service" }
          if ("${{ steps.filter.outputs.rate-limiter-service }}" -eq "true") { $services += "rate-limiter-service" }
          if ("${{ steps.filter.outputs.election-service }}" -eq "true") { $services += "election-service" }
          if ("${{ steps.filter.outputs.voting-service }}" -eq "true") { $services += "voting-service" }
          if ("${{ steps.filter.outputs.results-service }}" -eq "true") { $services += "results-service" }
          if ("${{ steps.filter.outputs.blockchain-service }}" -eq "true") { $services += "blockchain-service" }
          if ("${{ steps.filter.outputs.reporting-service }}" -eq "true") { $services += "reporting-service" }
          if ("${{ steps.filter.outputs.audit-log-service }}" -eq "true") { $services += "audit-log-service" }
          if ("${{ steps.filter.outputs.dashboard-service }}" -eq "true") { $services += "dashboard-service" }
          if ("${{ steps.filter.outputs.email-notifier-service }}" -eq "true") { $services += "email-notifier-service" }
          if ("${{ steps.filter.outputs.scheduler-backup-service }}" -eq "true") { $services += "scheduler-backup-service" }
          if ("${{ steps.filter.outputs.frontend }}" -eq "true") { $services += "frontend" }

          if ($services.Count -eq 0) {
            $matrix = '{\"include\":[]}'
          } else {
            $items = $services | ForEach-Object { "{\"image\":\"$_\"}" }
            $matrix = '{\"include\":[' + ($items -join ",") + ']}'
          }
          echo "matrix=$matrix" >> $env:GITHUB_OUTPUT
        shell: pwsh

  build-and-push:
    needs: detect-changes
    if: ${{ fromJson(needs.detect-changes.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push service
        if: ${{ matrix.image != 'frontend' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/local/docker/Dockerfile.nx-service
          build-args: |
            SERVICE_NAME=@org/${{ matrix.image }}
            SERVICE_DIR=${{ matrix.image }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
      - name: Build and push frontend
        if: ${{ matrix.image == 'frontend' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/local/docker/Dockerfile.frontend
          build-args: |
            EXPO_PUBLIC_API_BASE_URL=${{ vars.EXPO_PUBLIC_API_BASE_URL }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
