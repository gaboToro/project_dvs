name: CI

on:
  pull_request:
    branches: [qa, main]
  push:
    branches: [qa, main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Nx format check (optional)
        run: npx nx format:check
        continue-on-error: true

      - name: Lint
        run: npx nx run-many -t lint --all

      - name: Test
        run: npx nx run-many -t test --all

      - name: Build
        run: npx nx run-many -t build --all
